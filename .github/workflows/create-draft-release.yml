name: Release Drafter

# Keeps a draft release up to date as labelled PRs merge. The draft supplies the version number
# and notes that the Cut Release workflows turn into an actual release.

on:
  pull_request:
    types: [closed]

jobs:
  update_release_draft:
    # Skip the release PR itself: Cut Release Publish has already published (and made immutable)
    # that version, so a drafter update would fail trying to change an immutable release.
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0 # v7.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
