name: Cut Release

# This repo releases itself with its own PR-gated workflows, pinned to the last released SHA.
# Dogfooding means the flow the package repos depend on is exercised here first.
#
# Bootstrapping note: a release is cut using the PREVIOUS release of these workflows. If a broken
# release-prepare/publish ever ships, fix the next one by hand.

on:
  workflow_dispatch:

jobs:
  prepare:
    uses: edalzell/github-workflows/.github/workflows/release-prepare.yml@d3446ce832a9191e54e4015c91e2912f930f0df1 # v1.0.0
    permissions:
      contents: write
      pull-requests: write
