name: PR Labeler

# Reusable: labels opened PRs from branch name patterns. Config is this repo's
# `.github/pr-labeler.yml` (transformstudios, edalzell, and silentzco). The
# upstream action only reads config from the *caller* repo, so this workflow
# fetches the shared file and applies labels itself.
#
#   on:
#     pull_request:
#       types: [opened]
#   jobs:
#     label:
#       uses: edalzell/github-workflows/.github/workflows/label-pr.yml@<sha> # v1.x.y
#       permissions:
#         contents: read
#         pull-requests: write

on:
  workflow_call:

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply labels from shared config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Bump with the same release that ships this workflow (see release-draft config-name).
          CONFIG_REF: v1.3.0
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          CONFIG=$(gh api "repos/edalzell/github-workflows/contents/.github/pr-labeler.yml?ref=${CONFIG_REF}" --jq .content | base64 -d)
          export CONFIG HEAD_REF PR_NUMBER
          python3 <<'PY'
          import fnmatch
          import os
          import subprocess

          import yaml

          config = yaml.safe_load(os.environ["CONFIG"])
          branch = os.environ["HEAD_REF"]
          pr = os.environ["PR_NUMBER"]
          labels = []
          for label, patterns in config.items():
              if isinstance(patterns, str):
                  patterns = [patterns]
              if any(fnmatch.fnmatch(branch, pattern) for pattern in patterns):
                  labels.append(label)
          if not labels:
              print(f"No label matched branch {branch!r}")
              raise SystemExit(0)
          cmd = ["gh", "pr", "edit", pr, "--add-label", ",".join(labels)]
          print("Running:", " ".join(cmd))
          subprocess.check_call(cmd)
          PY
