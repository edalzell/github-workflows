name: Release

# Reusable release workflow shared across the transformstudios and edalzell packages.
# Single-phase flow, for repos whose `main` is NOT protected against direct pushes. Repos with a
# ruleset that forbids direct pushes use release-prepare.yml + release-publish.yml instead.
#
# Pin the `uses:` to a commit SHA (not @v1); keep the version in a trailing comment. Call it with:
#
#   jobs:
#     release:
#       uses: edalzell/github-workflows/.github/workflows/release.yml@<sha> # v1
#       permissions:
#         contents: write        # required: this workflow commits and publishes
#       with:
#         upload_assets: true     # only repos that ship a compiled dist/
#         composer_install: true  # only repos whose asset build needs PHP deps
#         asset_working_dir: resources  # dir containing the `dist` folder to tar
#
# GITHUB_TOKEN is passed through automatically; no `secrets:` block is needed.

on:
  workflow_call:
    inputs:
      upload_assets:
        description: Build a compiled asset bundle and attach it to the release
        type: boolean
        default: false
      composer_install:
        description: Run `composer install` before building assets (PHP packages)
        type: boolean
        default: false
      asset_working_dir:
        description: Directory containing the `dist` folder to tar (relative to repo root)
        type: string
        default: "."

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The releases endpoint returns newest first, so the first draft is the latest.
          draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq 'map(select(.draft))[0]')
          if [ "$draft" = "null" ] || [ -z "$draft" ]; then
            echo "No draft release found" >&2
            exit 1
          fi
          # Randomized, since a release body could itself contain a fixed delimiter like EOF.
          delim="body_$(openssl rand -hex 8)"
          {
            echo "id=$(jq -r .id <<<"$draft")"
            echo "tag_name=$(jq -r .tag_name <<<"$draft")"
            echo "body<<${delim}"
            jq -r .body <<<"$draft"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Composer dependencies
        if: ${{ inputs.composer_install }}
        run: composer install --no-interaction --prefer-dist

      - name: Build and upload assets
        if: ${{ inputs.upload_assets }}
        working-directory: ${{ inputs.asset_working_dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm run production
          tar -czvf dist.tar.gz dist
          # Upload against the draft by its tag; assets attach before the release goes public.
          gh release upload "${{ steps.draft.outputs.tag_name }}" dist.tar.gz --clobber

      # CLI, not stefanzweifel/changelog-updater-action: that action is a Docker
      # build of php:cli-alpine, and Docker Hub 429s the pull from GitHub-hosted runners.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install changelog-updater
        run: |
          composer global require wnx/changelog-updater:1.12.0 --no-interaction --no-progress
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"

      - name: Update changelog
        env:
          RELEASE_NOTES: ${{ steps.draft.outputs.body }}
          LATEST_VERSION: ${{ steps.draft.outputs.tag_name }}
        run: |
          changelog-updater update \
            --release-notes="$RELEASE_NOTES" \
            --latest-version="$LATEST_VERSION" \
            --github-actions-output \
            --write \
            --no-interaction

      - name: Commit updated changelog
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: main
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Patch by id rather than `gh release edit <tag>`: a draft has no git tag to look up.
          # -F sends a JSON boolean; -f would send the string "false".
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${{ steps.draft.outputs.id }}" \
            -F draft=false
